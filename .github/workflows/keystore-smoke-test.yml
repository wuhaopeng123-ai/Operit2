name: Keystore Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode and inspect the release keystore
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          AL: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "secrets 到位检查 (只打印长度, 不打印内容):"
          echo "  KEYSTORE_BASE64 len = ${#KS}"
          echo "  STORE_PASSWORD  len = ${#SP}"
          echo "  KEY_ALIAS           = ${AL}"
          echo "  KEY_PASSWORD    len = ${#KP}"
          for v in KS SP AL KP; do
            if [ -z "${!v}" ]; then
              echo "::error::secret $v 为空"
              exit 1
            fi
          done

          printf '%s' "$KS" | base64 -d > /tmp/release.keystore
          echo "keystore 大小 = $(stat -c%s /tmp/release.keystore) 字节"

          echo "--- keytool 读取检查 (验证 PKCS12 与 Java 的兼容性) ---"
          keytool -list -v \
            -keystore /tmp/release.keystore \
            -storepass "$SP" \
            -alias "$AL"

          echo "--- 私钥访问检查 (验证 keyPassword) ---"
          keytool -certreq \
            -alias "$AL" \
            -keystore /tmp/release.keystore \
            -storepass "$SP" \
            -keypass "$KP" > /dev/null
          echo "私钥可用"

          echo "SMOKE_TEST_OK"
